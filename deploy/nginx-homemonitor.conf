server {
    listen 80;
    listen [::]:80;
    server_name iot.crestlanegroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iot.crestlanegroup.com;

    ssl_certificate /etc/letsencrypt/live/iot.crestlanegroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.crestlanegroup.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /homemonitor/api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /homemonitor/ {
        alias /opt/home-monitor/public/;
        try_files $uri $uri/ /homemonitor/index.html;
    }

    location = /homemonitor {
        return 301 /homemonitor/;
    }
}
